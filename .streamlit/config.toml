[server]
headless = true

[browser]
gatherUsageStats = false

# Spotlight design system - the same palette and ink as the report figures
# (src/figstyle.py), so the app and the written report read as one product.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f5f1"
textColor = "#0b0b0b"
font = "sans serif"
